name: pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 官方 Pages 模板结构：build 与 deploy 分成两个 job。
# 单 job 时 upload-pages-artifact 刚 finalize，deploy-pages 立刻查 artifact
# 元数据会返回 "Found 0 artifact(s)"（最终一致性竞态，见 CI 日志）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 组装 Pages 站点（产物本身就是单文件）
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          printf '%s\n' '# Marine Propulsion Anatomy' 'Single-file WebGL demo; see the repository README.' > _site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
